# SGLang EDF for the PP round on clariden (GH200/sm_90a, aarch64).
#
# Pinned to a dated + SHA-tagged nightly, never `dev` or `latest`, so this run is
# reproducible. Commit 16a52bff (2026-07-28) is verified to contain
# LoadFormat.PRESHARDED; the loader landed in PR #24256 on 2026-07-25 and is in
# NO release -- absent from v0.5.10 through v0.5.16.
#
# If this image misbehaves on GH200, the same commit is also published as
# nightly-dev-cu12-20260729-16a52bff and nightly-dev-cu13-20260729-16a52bff.
# preflight.sbatch is what decides.
#
# HOME=/root as in the last round: caches land in the container overlay so every
# srun is a cold start. Does not make the OS page cache cold -- hence one fresh
# node per measured run.

image = "lmsysorg/sglang:nightly-dev-cu12-20260729-16a52bff"

mounts = [
  "/capstor:/capstor",
  "/iopsstor:/iopsstor",
]

workdir = "/iopsstor/scratch/cscs/yboughizane/simple-serving-stack/experiments/pp-loading-exp"

[env]
HOME = "/root"
NCCL_DEBUG = "WARN"
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"

[annotations]
com.pyxis.entrypoint_log = "true"
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"
