# Same image as experiments/clariden-loading-exp: lmsysorg/sglang:v0.5.10. The
# engine is held constant against the baselines this phase is compared to, so
# only workdir differs from that experiment's EDF.

image = "lmsysorg/sglang:v0.5.10"

mounts = [
  "/capstor:/capstor",
  "/iopsstor:/iopsstor",
]

workdir = "/iopsstor/scratch/cscs/yboughizane/simple-serving-stack/experiments/servekit-fast-weight-load/phase-1-no-overlap"

[env]
HOME = "/root"
NCCL_DEBUG = "WARN"
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"

[annotations]
com.pyxis.entrypoint_log = "true"
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"
