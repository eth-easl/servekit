# SGLang EDF for Llama-3.1-70B on clariden (GH200/sm_90a, aarch64).
#
# Same image TAG as the bristen experiment on purpose: lmsysorg/sglang:v0.5.10 is
# a multi-arch manifest, so enroot pulls the arm64 build here and the x86 build
# there. The engine version is therefore held constant and the hardware is the
# only variable. preflight.sbatch verifies that claim before any arm runs.
#
# HOME=/root is deliberate: HF / Triton / pip caches land in the container's
# ephemeral overlay, so every srun is a cold start. Note this does NOT make the
# OS page cache cold -- hence one fresh node per run.

image = "lmsysorg/sglang:v0.5.10"

mounts = [
  "/capstor:/capstor",
  "/iopsstor:/iopsstor",
]

workdir = "/iopsstor/scratch/cscs/yboughizane/simple-serving-stack/experiments/clariden-loading-exp"

[env]
HOME = "/root"
NCCL_DEBUG = "WARN"
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"

[annotations]
com.pyxis.entrypoint_log = "true"
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"
