# Enroot EDF for the CUDA checkpoint/restore feasibility test on Bristen.
#
# Stock nvidia/cuda *devel* image (has nvcc + apt). criu, cuda-checkpoint and the
# counter binary are bootstrapped in-job (compute nodes have internet), so no
# custom image build is needed. pyxis pulls + caches this on first use.
#
# ubuntu22.04 (jammy), NOT 24.04: criu was dropped from the noble archive
# ("no installation candidate"); jammy/universe still ships it.
image = "nvidia/cuda:12.6.2-devel-ubuntu22.04"

mounts = [
  "/capstor:/capstor",
  "/iopsstor:/iopsstor",
]

workdir = "/iopsstor/scratch/cscs/yboughizane/simple-serving-stack/experiments/cuda-checkpoint-exp"

[annotations]
com.pyxis.entrypoint_log = "true"
