# vLLM EDF for Llama-3.1-70B-Instruct on clariden (GH200/sm_90a, aarch64).
#
# vllm/vllm-openai is a multi-arch manifest, so enroot resolves the arm64 build
# here. Pinned to v0.25.0 (2026-07-11) rather than latest so the engine version
# stays a controlled variable across reruns. arm64 digest at pin time:
#   sha256:2f726db9babd627fb5...   (v0.26.0 of 2026-07-25 is the fallback)
# preflight_vllm.sbatch verifies arm64 + sm_90a + the compiled ext before any
# 4-GPU job is submitted.
image = "vllm/vllm-openai:v0.25.0"

mounts = [
  "/capstor:/capstor",
  "/iopsstor:/iopsstor",
]

workdir = "/iopsstor/scratch/cscs/yboughizane/simple-serving-stack"

[env]
# Container-local HOME: HF / torch.compile / Triton / pip caches land in the
# container's ephemeral overlay, so every srun is a genuine cold start. Note
# this does NOT make the OS page cache cold -- hence one fresh node per run.
HOME = "/root"
NCCL_DEBUG = "WARN"
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"

[annotations]
com.pyxis.entrypoint_log = "true"
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"
