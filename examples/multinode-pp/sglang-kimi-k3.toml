# The kimi-k3 image, imported once to a .sqsh so an 8-node job does not re-pull
# per node. Build it with build_kimi_k3_image.sbatch (one-off, see README).
#
# docker://lmsysorg/sglang:kimi-k3 is the only image that serves this model:
# KimiK3ForConditionalGeneration is not in any released sglang, and the dated
# nightly this example uses for llama70b falls back to the transformers path and
# dies with "Cannot find model module". That image also carries the presharded
# loader as an overlay, which is what makes --load-format presharded work here.
image = "/capstor/scratch/cscs/yboughizane/kimi-k3/images/sglang-kimi-k3.aarch64.sqsh"

mounts = [
  "/capstor:/capstor",
  "/iopsstor:/iopsstor",
]

workdir = "/iopsstor/scratch/cscs/yboughizane/simple-serving-stack/servekit/examples/multinode-pp"

[env]
HOME = "/root"
NCCL_DEBUG = "WARN"
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"

# Slingshot tunables verified for K3 multi-node on clariden. The aws_ofi_nccl
# hook below supplies the CXI data path; these bound the bootstrap sockets to
# the high-speed NIC and size the CXI queues for cross-node pipeline P2P.
# FI_MR_CACHE_MONITOR=userfaultfd replaces the default monitor, which
# mishandles CXI-registered memory.
NCCL_NET = "AWS Libfabric"
NCCL_SOCKET_IFNAME = "hsn0"
GLOO_SOCKET_IFNAME = "hsn0"
NCCL_CROSS_NIC = "1"
FI_CXI_DISABLE_HOST_REGISTER = "1"
FI_CXI_DEFAULT_CQ_SIZE = "131072"
FI_CXI_RDZV_THRESHOLD = "0"
FI_CXI_RDZV_GET_MIN = "0"
FI_MR_CACHE_MONITOR = "userfaultfd"

# The aws_ofi_nccl hook is what puts NCCL on Slingshot. Pipeline parallel sends
# far less across nodes than tensor parallel does, but the rendezvous and the
# dump's all-gather still go over it.
#
# variant is cuda13 here, not cuda12: this image is CUDA 13.
[annotations]
com.pyxis.entrypoint_log = "true"
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda13"
