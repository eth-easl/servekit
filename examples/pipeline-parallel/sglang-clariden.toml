# SGLang for the pipeline-parallel example on clariden (GH200/sm_90a, aarch64).
#
# The floor is v0.5.11 and it is not negotiable: servekit keeps pipeline stages
# from overwriting each other's shards through an SGLang plugin, and the plugin
# framework landed on 2026-04-20, fifteen days after v0.5.10. On an older image
# the entry point is never discovered, every stage writes the same filenames,
# and the dump silently holds a fraction of the model.
image = "lmsysorg/sglang:v0.5.16"

mounts = [
  "/capstor:/capstor",
  "/iopsstor:/iopsstor",
]

workdir = "/iopsstor/scratch/cscs/yboughizane/cold-start-elimination/servekit-pp-shim/examples/pipeline-parallel"

[env]
HOME = "/root"
NCCL_DEBUG = "WARN"
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"

[annotations]
com.pyxis.entrypoint_log = "true"
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"
