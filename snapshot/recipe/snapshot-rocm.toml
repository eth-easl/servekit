# Pinned to the same ROCm vLLM image used by the GLM ROCm deployment so runtime
# HIP/VMM behavior is tested in the same container family as production.
image = "vllm/vllm-openai-rocm@sha256:3813e31cc3ab56f71ba83a72da77a84f3c75030e54c9c316951a99317b818ce4"

mounts = [
  "/capstor:/capstor",
  "/users/xyao:/users/xyao",
  "/iopsstor:/iopsstor",
]

workdir = "/capstor/scratch/cscs/xyao/kimi-k25-vllm"

[env]
HOME = "/capstor/scratch/cscs/xyao/kimi-k25-vllm/home"
XDG_CACHE_HOME = "/capstor/scratch/cscs/xyao/kimi-k25-vllm/cache/xdg"
XDG_CONFIG_HOME = "/capstor/scratch/cscs/xyao/kimi-k25-vllm/cache/config"
HSA_NO_SCRATCH_RECLAIM = "1"
ROCM_PATH = "/opt/rocm"
HIP_PATH = "/opt/rocm"
LD_LIBRARY_PATH = "/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:/opt/rocm/lib:/usr/local/lib"
PIP_BREAK_SYSTEM_PACKAGES = "1"
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"

[annotations]
com.pyxis.entrypoint_log = "true"
