# CUDA build/test container for the snapshot CudaBackend on bristen (A100/sm_80).
#
# Toolchain probe (2026-06-26) on nvidia/cuda:12.6.3-devel-ubuntu24.04 confirmed:
#   CUDA 12.6.85, g++ 13.2.0, cuda.h + nvrtc.h, libcuda.so (driver 550/560),
#   libnvrtc.so.12.6.85. The devel image has NO cmake/wget/curl/python3 (runs as
#   the invoking user, read-write rootfs). So a standalone CMake binary tarball
#   (3.30.8) is fetched once on the login node into ./cmake/ and prepended to
#   PATH by build_snapshot_cuda.sbatch (a system cmake on PATH, if any, wins).
# libcuda.so is injected by the CSCS container engine's NVIDIA hook at runtime.
image = "nvidia/cuda:12.6.3-devel-ubuntu24.04"

mounts = [
  "/capstor:/capstor",
  "/users/xyao:/users/xyao",
  "/iopsstor:/iopsstor",
]

workdir = "/capstor/scratch/cscs/xyao/snapshot-cuda"

[env]
HOME = "/capstor/scratch/cscs/xyao/snapshot-cuda/home"

[annotations]
com.pyxis.entrypoint_log = "true"
