name    = "glm-47-flash-beverin"
profile = "glm-47-flash"
engine  = "vllm"
served_model_name = "zai-org/GLM-4.7-Flash-rocm"
port = 8000
default_nodes = 5

[scripts]
probe = "probe_vllm.sbatch"
serve = "serve_glm_47_flash.sbatch"

[ready]
markers = ["APIV1-server", "vmagent_started"]
log_pattern = "logs/opentela-{job}-{rank}.log"

[verify]
models_path = "/v1/models"
chat_path   = "/v1/chat/completions"

[snapshot]
enabled = false
