# Pinned by digest so the JIT compile caches (TRITON_CACHE_DIR / VLLM_CACHE_ROOT /
# VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR on shared /capstor) stay warm across launches.
# A floating :latest silently moves and invalidates the whole cache.
# Resolved 2026-06-18 from Docker Hub vllm/vllm-openai-rocm:latest.
image = "vllm/vllm-openai-rocm@sha256:3813e31cc3ab56f71ba83a72da77a84f3c75030e54c9c316951a99317b818ce4"

mounts = [
  "/capstor:/capstor",
  "/users/xyao:/users/xyao",
  "/iopsstor:/iopsstor",
]

workdir = "/capstor/scratch/cscs/xyao/glm-47-flash-vllm"

[env]
HOME = "/capstor/scratch/cscs/xyao/glm-47-flash-vllm/home"
HF_HOME = "/capstor/store/cscs/swissai/infra02/xyao/cache/hf"
XDG_CACHE_HOME = "/capstor/scratch/cscs/xyao/glm-47-flash-vllm/cache/xdg"
XDG_CONFIG_HOME = "/capstor/scratch/cscs/xyao/glm-47-flash-vllm/cache/config"
VLLM_CACHE_ROOT = "/capstor/scratch/cscs/xyao/glm-47-flash-vllm/cache/vllm"
VLLM_NO_USAGE_STATS = "1"
VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR = "/capstor/scratch/cscs/xyao/glm-47-flash-vllm/cache/flashinfer"
TRITON_CACHE_DIR = "/capstor/scratch/cscs/xyao/glm-47-flash-vllm/cache/triton"
HSA_NO_SCRATCH_RECLAIM = "1"
ROCM_PATH = "/opt/rocm"
HIP_PATH = "/opt/rocm"
LD_LIBRARY_PATH = "/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:/opt/rocm/lib:/usr/local/lib"
VLLM_ROCM_USE_AITER = "1"
VLLM_ROCM_USE_AITER_MLA = "0"
VLLM_ROCM_QUICK_REDUCE_QUANTIZATION = "INT4"
VLLM_ROCM_USE_AITER_RMSNORM = "0"
NCCL_DEBUG = "WARN"
NCCL_SOCKET_IFNAME = "hsn"
PIP_BREAK_SYSTEM_PACKAGES = "1"
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"

[annotations]
com.pyxis.entrypoint_log = "true"
