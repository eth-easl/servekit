# Pinned by digest (same rationale as the beverin ROCm EDF): a floating :latest
# silently moves under you and invalidates the Triton/FlashInfer JIT caches kept
# on shared /capstor. Resolved 2026-06-26 from Docker Hub lmsysorg/sglang:v0.5.9
# (CUDA 12.9.1, NCCL 2.27.3, FlashInfer 0.6.3 -- A100 / sm_80 compatible).
#
# To re-resolve when intentionally upgrading, see the image-pinning snippet in
# deploy/glm-47-flash-bristen/README.md.
image = "lmsysorg/sglang@sha256:e216b7dc4ac1938b599b982233ccf7eb2b11dd1f07fc2e00a7b9841052c553be"

mounts = [
  "/capstor:/capstor",
  "/users/xyao:/users/xyao",
  "/iopsstor:/iopsstor",
]

workdir = "/capstor/scratch/cscs/xyao/glm-47-flash-sglang"

[env]
HOME = "/capstor/scratch/cscs/xyao/glm-47-flash-sglang/home"
HF_HOME = "/capstor/scratch/cscs/xyao/glm-47-flash-sglang/cache/hf"
XDG_CACHE_HOME = "/capstor/scratch/cscs/xyao/glm-47-flash-sglang/cache/xdg"
TRITON_CACHE_DIR = "/capstor/scratch/cscs/xyao/glm-47-flash-sglang/cache/triton"
NCCL_DEBUG = "WARN"
# Use the image's own SGLang/torch; never pick up the stale user venvs on /users.
PYTHONPATH = ""
PYTHONNOUSERSITE = "1"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"

[annotations]
com.pyxis.entrypoint_log = "true"
